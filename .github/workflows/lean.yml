name: Lean bridge verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r012-lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Verify exact pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.32.0"
          lake env lean --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = \
            "81a5d257c8e410db227a6665ed08f64fea08e997"
      - name: Build formal bridge
        env:
          LEAN_NUM_THREADS: '2'
        shell: bash
        run: |
          set -euo pipefail
          lake build R012 R012.Audit
      - name: Reject production proof shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          sources = [pathlib.Path('R012.lean')]
          sources.extend(sorted(pathlib.Path('R012').rglob('*.lean')))
          pattern = re.compile(r'\b(?:sorry|admit|native_decide)\b|debug\.skipKernelTC|Lean\.ofReduceBool|^\s*(?:axiom|opaque|unsafe|extern|partial)\b|^\s*@\[implemented_by')
          hits=[]
          for path in sources:
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pattern.search(line):
                      hits.append(f'{path}:{n}:{line}')
          if hits:
              print('\n'.join(hits))
              sys.exit(1)
          print(f'Production-source scan empty across {len(sources)} Lean files.')
          PY
      - name: Trust-zero axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean --trust=0 R012/Audit.lean 2>&1 | tee axioms.log
          ! grep -Fq 'sorryAx' axioms.log
          ! grep -Fq 'Lean.trustCompiler' axioms.log
