name: Exact verification

on:
  push:
  pull_request:

jobs:
  near-low:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify near root through 10
        run: |
          ./verify near
          for a in 2 3 4 5 6 7 8 9; do ./verify range "$a" "$((a+1))"; done

  low-10-50:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify 10 through 50
        run: |
          for a in 10 15 20 25 30 35 40 45; do ./verify range "$a" "$((a+5))"; done

  low-50-100:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify 50 through 100
        run: |
          for a in 50 60 70 80 90; do ./verify range "$a" "$((a+10))"; done

  middle-100-500:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify 100 through 500
        run: |
          for a in 100 200 300 400; do ./verify range "$a" "$((a+100))"; done

  middle-500-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify 500 through 1000
        run: |
          for a in 500 600 700 800 900; do ./verify range "$a" "$((a+100))"; done

  far-1000-6000:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify 1000 through 6000
        run: |
          for a in 1000 2000 3000 4000 5000; do ./verify range "$a" "$((a+1000))"; done

  far-6000-11500:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify 6000 through 11500
        run: |
          for a in 6000 7000 8000 9000 10000; do ./verify range "$a" "$((a+1000))"; done
          ./verify range 11000 11500

  tail-radius:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: g++ -O3 -std=c++17 verify.cpp -o verify
      - name: Verify infinite tail and exact radius comparison
        run: |
          ./verify tail
          ./verify radius

  exact-replay:
    runs-on: ubuntu-latest
    needs: [near-low, low-10-50, low-50-100, middle-100-500, middle-500-1000, far-1000-6000, far-6000-11500, tail-radius]
    steps:
      - run: |
          echo 'R012 FULL EXACT REPLAY PASSED'
          echo 'A_+(1) <= sqrt(1912071/(2000000*pi)) < 0.551649'
